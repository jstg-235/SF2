name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Mac only for now (J Rock, 11 Nov 2026). Windows and Linux can come back by adding:
        #   - { name: Windows, os: windows-2022, pluginval: pluginval_Windows.zip }
        #   - { name: Linux, os: ubuntu-24.04, pluginval: pluginval_Linux.zip }
        include:
          - name: macOS
            os: macos-15
            pluginval: pluginval_macOS.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}
          unzip -q pluginval.zip -d pluginval

      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   PV=pluginval/pluginval.app/Contents/MacOS/pluginval ;;
            Windows) PV=pluginval/pluginval.exe ;;
            *)       PV=pluginval/pluginval ;;
          esac
          VST3=$(find build/plugin/SF2_artefacts -name "SF2.vst3" -maxdepth 3 | head -n 1)
          "$PV" --strictness-level 7 --skip-gui-tests --validate-in-process --validate "$VST3"

      - name: Package
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(SF2 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          ART=build/plugin/SF2_artefacts/Release
          mkdir -p dist/SF2
          cp -R "$ART/VST3/SF2.vst3" dist/SF2/
          if [ -d "$ART/AU" ]; then cp -R "$ART/AU/SF2.component" dist/SF2/; fi
          cp -R "$ART/Standalone/"* dist/SF2/
          cp "packaging/INSTALL-$RUNNER_OS.txt" dist/SF2/INSTALL.txt
          ZIP="SF2-$VERSION-$RUNNER_OS.zip"
          case "$RUNNER_OS" in
            macOS)   (cd dist && ditto -c -k --keepParent SF2 "../$ZIP") ;;
            Windows) (cd dist && 7z a -tzip "../$ZIP" SF2 > /dev/null) ;;
            *)       (cd dist && zip -qry "../$ZIP" SF2) ;;
          esac
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SF2-${{ runner.os }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^project(SF2 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/*.zip --clobber
          else
            gh release create "$TAG" packages/*.zip --target "$GITHUB_SHA" --title "SF2 $VERSION" \
              --notes "Downloads for macOS (VST3, AU, app), Windows (VST3, app) and Linux (VST3, app). Unzip and see INSTALL.txt. Builds are not code-signed yet."
          fi
